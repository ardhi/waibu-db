<% const addons = arguments[0].addOns ?? [] %>
<% if (addons.length >= 0) { %>
<c:div append-to="#sb-addons">
  <c:grid-row>
  <% for (const ao of addons) { %>
    <c:grid-col col="12">
    <!-- include <%= ao.resource %>|<%= JSON.stringify(ao.data) %> -->
    </c:grid-col>
  <% } %>
  </c:grid-row>
</c:div>
<% } %>
